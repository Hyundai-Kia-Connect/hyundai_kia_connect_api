name: Label small PRs

on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize

permissions:
    pull-requests: write

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v9
              with:
                  script: |
                      // Matches the "under 100 changed lines, tests excluded" rule in AGENTS.md.
                      const MAX_CHANGED_LINES = 100;
                      const LABEL = "small";
                      const EXCLUDED = [/^tests\//];

                      const pr = context.payload.pull_request;
                      const files = await github.paginate(github.rest.pulls.listFiles, {
                          ...context.repo,
                          pull_number: pr.number,
                          per_page: 100,
                      });
                      const changed = files
                          .filter((f) => !EXCLUDED.some((re) => re.test(f.filename)))
                          .reduce((sum, f) => sum + f.additions + f.deletions, 0);
                      const isSmall = changed < MAX_CHANGED_LINES;
                      const hasLabel = pr.labels.some((l) => l.name === LABEL);
                      core.info(`${changed} changed lines outside tests; small=${isSmall}`);

                      if (isSmall && !hasLabel) {
                          await github.rest.issues.addLabels({
                              ...context.repo,
                              issue_number: pr.number,
                              labels: [LABEL],
                          });
                      } else if (!isSmall && hasLabel) {
                          await github.rest.issues.removeLabel({
                              ...context.repo,
                              issue_number: pr.number,
                              name: LABEL,
                          });
                      }
