# This workflow runs the pytest suite across the supported Python versions.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test Builds

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest
        name: "test py${{ matrix.python-version }}"
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[image] pytest pytest-cov syrupy
            - name: Run tests
              run: pytest --cov=hyundai_kia_connect_api --cov-report=term-missing --cov-report=xml
            # Coverage is the same on every Python version, so upload it once.
            # Fork PRs have no secrets; the action then uploads tokenless.
            - name: Upload coverage to Codecov
              if: matrix.python-version == '3.13'
              uses: codecov/codecov-action@v5
              with:
                  files: coverage.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false
