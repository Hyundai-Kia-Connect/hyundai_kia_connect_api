# This workflow runs the pytest suite across the supported Python versions,
# plus mypy --strict.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test Builds

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest
        name: "test py${{ matrix.python-version }}"
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[image] pytest syrupy
            - name: Run tests
              run: pytest

    # Runs the pre-commit hook so CI uses the same mypy pin, --strict and deps.
    mypy:
        runs-on: ubuntu-latest
        name: mypy --strict
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python 3.13
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip
            - name: Install pre-commit
              run: python -m pip install pre-commit
            - name: Run mypy
              run: pre-commit run mypy --all-files

    # Its own job so coverage shows as a separate "Coverage" check, with the
    # report on the run's summary page.
    coverage:
        runs-on: ubuntu-latest
        name: Coverage
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python 3.13
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[image] pytest pytest-cov syrupy
            - name: Run tests with coverage
              run: pytest --cov=hyundai_kia_connect_api --cov-report=term-missing --cov-report=xml
            - name: Write coverage summary
              env:
                  CODECOV_URL: ${{ github.event_name == 'pull_request' && format('https://app.codecov.io/gh/{0}/pull/{1}', github.repository, github.event.pull_request.number) || format('https://app.codecov.io/gh/{0}/commit/{1}', github.repository, github.sha) }}
              run: |
                  {
                    echo "## Coverage: $(coverage report --format=total)%"
                    echo
                    echo "Full report: [Codecov]($CODECOV_URL)"
                    echo
                    coverage report --format=markdown --skip-covered
                  } >> "$GITHUB_STEP_SUMMARY"
            # Fork PRs have no secrets; the action then uploads tokenless.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: coverage.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false
