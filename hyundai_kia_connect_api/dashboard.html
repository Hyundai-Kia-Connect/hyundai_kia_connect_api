<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roadbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<style>
body{margin:0}
a{color:var(--brandText)}a:hover{color:var(--ink)}
.rb{--sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cond:"Barlow Condensed","Barlow",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.22,1,.36,1);--w0:2.5;--w1:4;--w2:4;--w3:4;--w4:4;-webkit-font-smoothing:antialiased}
.t-light{--ground:#eef0f3;--surface:#fff;--surface2:#f4f5f7;--inset:#e6e9ed;--line:rgba(19,22,27,.1);--line2:rgba(19,22,27,.18);--ink:#13161b;--ink2:#3d434d;--ink3:#5c636e;--bar:rgba(238,240,243,.78);--brand:#0d6b4e;--brandText:#0b5e44;--onBrand:#fff;--s0:#9aa1ab;--s1:#1d6fe0;--s2:#1a9a4a;--s3:#d9a400;--s4:#d92d20;--bad:#d92d20;--badText:#b42318;--badBg:rgba(217,45,32,.1);--warn:#c77700;--warnText:#8a4f00;--warnBg:rgba(217,140,0,.12);--okText:#0b5e44;--okBg:rgba(13,107,78,.09);--neuBg:rgba(19,22,27,.06);--track:rgba(19,22,27,.1);--skel:#e3e6ea;--skel2:#f1f3f5;
--sky:#dfe4ea;--mLand:#e8ebee;--mHillLit:#f7f8f9;--mHillDark:#c5ccd5;--mWater:#b8cfe4;--mRoad:#fff;--bLit:#dde1e6;--bDark:#b9c0c9;--bTop:#f5f6f8;--mContour:#d3d8de;--glowW:11;--glowOp:.18;--pinStart:#1a9a4a;--pinEnd:#d92d20;--pinRing:#fff;
--paint:#2f4f7f;--glass:#26303c;--glassEdge:#4a5666;--cabin:#1b1f25;--lampOff:#dfe6ee;--tailOff:#8c1f1a;--tyre:#1a1c20;--rim:#9aa3ad;--carShadow:rgba(19,22,27,.16);--cable:#1d2026;--charge:#0d6b4e;color-scheme:light}
.t-dark{--ground:#0e1116;--surface:#161a21;--surface2:#1c2129;--inset:#232933;--line:rgba(238,241,245,.08);--line2:rgba(238,241,245,.16);--ink:#eef1f5;--ink2:#c3c9d2;--ink3:#959ca7;--bar:rgba(14,17,22,.74);--brand:#34b386;--brandText:#5fd0a5;--onBrand:#06140f;--s0:#5e6570;--s1:#4f8ff7;--s2:#28a957;--s3:#d9a81c;--s4:#f2554a;--bad:#f2554a;--badText:#ff9187;--badBg:rgba(242,85,74,.15);--warn:#f0a63a;--warnText:#ffc56e;--warnBg:rgba(240,166,58,.14);--okText:#6fdcb0;--okBg:rgba(52,179,134,.13);--neuBg:rgba(238,241,245,.07);--track:rgba(238,241,245,.1);--skel:#1c2129;--skel2:#262c36;
--sky:#090c11;--mLand:#131820;--mHillLit:#29323f;--mHillDark:#0f131a;--mWater:#0b1f31;--mRoad:#262d38;--bLit:#2a323e;--bDark:#191f28;--bTop:#38414f;--mContour:#222a35;--glowW:15;--glowOp:.3;--pinStart:#28a957;--pinEnd:#f2554a;--pinRing:#0e1116;
--paint:#3a5f96;--glass:#121821;--glassEdge:#3a4658;--cabin:#07090c;--lampOff:#c9d3de;--tailOff:#7a1d1a;--tyre:#0b0c0f;--rim:#7d8690;--carShadow:rgba(0,0,0,.5);--cable:#0b0c0f;--charge:#34b386;color-scheme:dark}
.t-bw{--ground:#f0f0f0;--surface:#fff;--surface2:#f5f5f5;--inset:#e6e6e6;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.24);--ink:#000;--ink2:#2b2b2b;--ink3:#555;--bar:rgba(240,240,240,.8);--brand:#000;--brandText:#000;--onBrand:#fff;--s0:#c8c8c8;--s1:#b0b0b0;--s2:#7c7c7c;--s3:#474747;--s4:#111;--w1:2.6;--w2:4;--w3:5.6;--w4:7.6;--bad:#000;--badText:#000;--badBg:#e2e2e2;--warn:#333;--warnText:#000;--warnBg:#ececec;--okText:#000;--okBg:#f0f0f0;--neuBg:#f0f0f0;--track:rgba(0,0,0,.12);--skel:#e4e4e4;--skel2:#f2f2f2;
--sky:#e2e2e2;--mLand:#ececec;--mHillLit:#fafafa;--mHillDark:#c4c4c4;--mWater:#d0d0d0;--mRoad:#fff;--bLit:#dedede;--bDark:#b4b4b4;--bTop:#f6f6f6;--mContour:#d2d2d2;--glowW:0;--glowOp:0;--pinStart:#fff;--pinEnd:#000;--pinRing:#000;
--paint:#8a8a8a;--glass:#3a3a3a;--glassEdge:#5a5a5a;--cabin:#111;--lampOff:#e8e8e8;--tailOff:#555;--tyre:#1a1a1a;--rim:#a0a0a0;--carShadow:rgba(0,0,0,.16);--cable:#1a1a1a;--charge:#000;color-scheme:light}
.night{--sky:#090c11;--mLand:#131820;--mHillLit:#29323f;--mHillDark:#0f131a;--mWater:#0b1f31;--mRoad:#262d38;--bLit:#2a323e;--bDark:#191f28;--bTop:#38414f;--mContour:#222a35;--glowW:15;--glowOp:.32;--pinRing:#0e1116;--s1:#4f8ff7;--s2:#28a957;--s3:#d9a81c;--s4:#f2554a;--s0:#5e6570;--hudInk:#eef1f5;--hudInk2:#b7bfca;--hudGlass:rgba(16,20,27,.58);--hudLine:rgba(238,241,245,.14)}
.t-bw .night{--sky:#d9d9d9;--mLand:#e6e6e6;--mHillLit:#f7f7f7;--mHillDark:#bdbdbd;--mWater:#cdcdcd;--mRoad:#fff;--bLit:#d6d6d6;--bDark:#acacac;--bTop:#f2f2f2;--glowW:0;--glowOp:0;--pinRing:#000;--s0:#c8c8c8;--s1:#b0b0b0;--s2:#7c7c7c;--s3:#474747;--s4:#111;--hudInk:#000;--hudInk2:#333;--hudGlass:rgba(255,255,255,.72);--hudLine:rgba(0,0,0,.18)}
.sat{--sky:#1d2328;--mLand:#3b4733;--mHillLit:#6a7a52;--mHillDark:#28311f;--mWater:#173447;--mRoad:#8d8b80;--bLit:#a39d90;--bDark:#6c675d;--bTop:#c9c3b5}
.t-bw .sat{--sky:#cfcfcf;--mLand:#9a9a9a;--mHillLit:#c4c4c4;--mHillDark:#707070;--mWater:#7d7d7d;--mRoad:#e0e0e0;--bLit:#bdbdbd;--bDark:#8a8a8a;--bTop:#dadada}
.rb *{box-sizing:border-box}
.cond{font-family:var(--cond);letter-spacing:-.005em}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.btn{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;transition:transform .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97);transition-duration:.05s}
.rb :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.hov:hover{background:var(--surface2)}
.tab-ind{transition:transform .46s var(--ease),width .46s var(--ease)}
.panel{animation:enter .42s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{background:linear-gradient(90deg,var(--skel) 0%,var(--skel2) 50%,var(--skel) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite;border-radius:6px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.rd{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 2.6s .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fly{transform-origin:62% 55%;animation:fly 3.2s var(--ease) both}
@keyframes fly{from{transform:scale(1.85) translate(-6%,6%) rotate(-3deg)}to{transform:none}}
.sweep{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.6s .9s var(--ease) forwards}
.odo-col{transition:transform 1.4s var(--ease)}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.08}50%{opacity:.32}}
.warn-pulse{animation:wpulse 1.4s ease-in-out infinite}
@keyframes wpulse{0%,100%{fill:var(--tyre)}50%{fill:var(--warn)}}
.hatch{background:repeating-linear-gradient(135deg,var(--inset) 0 3px,transparent 3px 7px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cv{display:none}
.pt{transition:opacity .2s}
.scroll-x{scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
input::placeholder{color:var(--ink3)}
.rail-dash{background:repeating-linear-gradient(90deg,var(--ink3) 0 10px,transparent 10px 20px);opacity:.5}
.yaw0 .cv0{display:inline}.yaw1 .cv1{display:inline}.yaw2 .cv2{display:inline}.yaw3 .cv3{display:inline}.yaw4 .cv4{display:inline}.yaw5 .cv5{display:inline}.yaw6 .cv6{display:inline}.yaw7 .cv7{display:inline}.yaw8 .cv8{display:inline}.yaw9 .cv9{display:inline}.yaw10 .cv10{display:inline}.yaw11 .cv11{display:inline}.hl-door-fl .p-door-fl{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-door-fr .p-door-fr{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-door-rl .p-door-rl{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-door-rr .p-door-rr{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-trunk .p-trunk{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-hood .p-hood{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-sunroof .p-sunroof{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-window .p-window{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-tyre-fl .p-tyre-fl{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-tyre-fr .p-tyre-fr{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-tyre-rl .p-tyre-rl{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-tyre-rr .p-tyre-rr{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-lamp-front .p-lamp-front{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-lamp-rear .p-lamp-rear{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.hl-port .p-port{stroke:var(--brand)!important;stroke-width:3.5px!important;opacity:1}.spin{animation:spin 1s linear infinite;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rb *{animation:none!important;transition:none!important}.rd,.sweep{stroke-dashoffset:0!important}}
@media (max-width:760px){
.top-in{grid-template-columns:minmax(0,1fr) auto!important;padding:8px 14px 0!important;row-gap:6px!important}
.tabs-row{grid-column:1/-1!important;order:3;justify-self:stretch!important;overflow-x:auto!important;margin:0 -14px!important;padding:0 14px!important}
.hide-sm{display:none!important}
.main{padding:14px 14px 56px!important}
.hero{height:600px!important}
.cluster{left:12px!important;right:12px!important;bottom:12px!important;width:auto!important}
.big{font-size:64px!important}
.tl-list{max-width:none!important;max-height:none!important;flex-basis:100%!important}
.has-sel .tl-list{display:none!important}
.no-sel .tl-detail{display:none!important}
.has-sel .tl-detail{animation:slidein .38s var(--ease) both}
.back{display:inline-flex!important}
.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.chart-box{height:170px!important}
.h1{font-size:30px!important}
.ep-grid{grid-template-columns:minmax(0,1fr)!important}
.sheet{width:100%!important;max-width:none!important}
}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

.rb-bw .maplibregl-canvas{filter:grayscale(1) contrast(1.05)}
.maplibregl-ctrl-attrib{font-size:11px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* The tabs get their own full-width row once the header can't fit them beside the controls. */
@media (max-width:1240px){
.top-in{grid-template-columns:minmax(0,1fr) auto!important;row-gap:2px!important}
.tabs-row{grid-column:1/-1!important;order:3;justify-self:stretch!important;overflow-x:auto!important;margin:0 -8px!important}
}
/* On phones the row can still overflow: fade the edge so it reads as scrollable. */
@media (max-width:760px){.tabs-row{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}}
</style>
</head>
<body>
<div id="rb-root"></div>
<template id="rb-template">
<div class="rb {{themeClass}}" style="min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45">

<sc-if value="{{isApp}}" hint-placeholder-val="{{ true }}">
<header style="position: sticky; top: 0; z-index: 40; background: var(--bar); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px); border-bottom: 1px solid var(--line)">
<div class="top-in" style="max-width: 1400px; margin: 0 auto; padding: 10px 24px 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 18px">
<div style="display: flex; align-items: center; gap: 14px; min-width: 0; padding-bottom: 10px">
<div aria-label="Roadbook" role="img" style="flex: none; display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px 0 7px; border-radius: 6px; background: var(--brand); color: var(--onBrand); box-shadow: inset 0 0 0 2px var(--brand), inset 0 0 0 3.5px var(--onBrand)">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 21l2.2-18 M16 21l-2.2-18 M12 5v2.5 M12 10.5v2.5 M12 16v2.5" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"></path></svg>
<span class="cond" style="font-weight: 700; font-size: 19px; letter-spacing: 0.01em">Roadbook</span>
</div>
<div style="position: relative">
<button class="btn hov" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-haspopup="true" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 4px; border-radius: 8px; max-width: 340px">
<span aria-hidden="true" style="position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--inset); display: flex; align-items: center; justify-content: center; color: var(--ink2)">
<svg viewBox="0 0 32 20" width="26" height="16"><path d="{{car.sil}}" style="fill: currentColor"></path></svg>
<span style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: {{syncDot}}; box-shadow: 0 0 0 2.5px var(--ground)"></span>
</span>
<span style="min-width: 0; display: flex; flex-direction: column; line-height: 1.15">
<span class="cond" style="font-weight: 700; font-size: 17px">{{car.nick}}</span>
<span class="tnum" style="font-size: 12.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{car.model}} · {{car.fuelLabel}} · <span class="hide-sm">{{syncText}}</span></span>
</span>
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none; color: var(--ink3)"><path d="M6 9l6 6 6-6" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: 50px; left: 0; z-index: 50; width: 320px; padding: 6px; border-radius: 10px; background: var(--surface); box-shadow: 0 12px 40px rgba(0,0,0,.22), 0 0 0 1px var(--line)">
<sc-for list="{{cars}}" as="cc" hint-placeholder-count="2">
<button class="btn hov" role="menuitemradio" aria-checked="{{cc.on}}" onClick="{{cc.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 6px 8px; border-radius: 7px">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--inset); display: flex; align-items: center; justify-content: center; color: var(--ink2)"><svg viewBox="0 0 32 20" width="26" height="16"><path d="{{cc.sil}}" style="fill: currentColor"></path></svg></span>
<span style="flex: 1; min-width: 0"><span class="cond" style="display: block; font-weight: 700; font-size: 16px">{{cc.nick}}</span><span class="tnum" style="font-size: 12.5px; color: var(--ink3)">{{cc.model}} · {{cc.fuelLabel}}</span></span>
<span style="font-size: 12px; color: var(--ink3)">{{cc.sync}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</div>
<nav class="tabs-row scroll-x" aria-label="Sections" style="justify-self: center; align-self: end; overflow-x: auto; max-width: 100%">
<div style="position: relative; display: flex; gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<button class="btn" aria-current="{{t.current}}" onClick="{{t.pick}}" style="position: relative; height: 48px; padding: 0 14px; font-family: var(--cond); font-size: 17px; font-weight: {{t.weight}}; color: {{t.color}}; white-space: nowrap; letter-spacing: 0.005em">{{t.label}}<span style="position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); transform: scaleX({{t.bar}}); transition: transform .42s var(--ease)"></span></button>
</sc-for>
</div>
</nav>
<div style="display: flex; align-items: center; gap: 8px; padding-bottom: 10px; justify-self: end">
<div class="hide-sm tnum" style="font-size: 12.5px; color: var(--ink3); text-align: right; line-height: 1.2">{{syncLabel}}</div>
<button class="btn" onClick="{{syncNow}}" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--line2); font-weight: 600; font-size: 14px">
<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="{{syncSpin}}"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8 M4 4v4h4 M4 13a8 8 0 0 0 14.5 4.5L20 16 M20 20v-4h-4" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"></path></svg><span class="hide-sm">{{syncBtn}}</span></button>
<div role="group" aria-label="Theme" class="hide-sm" style="display: flex; padding: 3px; border-radius: 8px; background: var(--inset)">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="4">
<button class="btn" aria-label="{{th.label}}" title="{{th.label}}" aria-pressed="{{th.pressed}}" onClick="{{th.pick}}" style="width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: {{th.color}}; background: {{th.bg}}; box-shadow: {{th.shadow}}"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="{{th.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg></button>
</sc-for>
</div>
<button class="btn hov" aria-label="Settings" onClick="{{openSettings}}" style="width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink2)"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round"></path></svg></button>
</div>
</div>
</header>

<main class="main" style="max-width: 1400px; margin: 0 auto; padding: 20px 24px 72px">

<sc-for list="{{banners}}" as="bn" hint-placeholder-count="0">
<div role="{{bn.role}}" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 16px; border-radius: 8px; background: {{bn.bg}}; color: {{bn.fg}}; box-shadow: inset 0 0 0 1px {{bn.ring}}">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none"><path d="{{bn.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<div style="flex: 1 1 320px"><strong>{{bn.title}}</strong> {{bn.body}}<sc-if value="{{bn.code}}" hint-placeholder-val="{{ false }}"> <code class="mono" style="padding: 2px 6px; border-radius: 4px; background: var(--surface); color: var(--ink); font-weight: 600">{{bn.code}}</code></sc-if></div>
<sc-if value="{{bn.cta}}" hint-placeholder-val="{{ false }}"><button class="btn" style="height: 40px; padding: 0 16px; border-radius: 7px; background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line2)">{{bn.cta}}</button></sc-if>
</div>
</sc-for>

<sc-if value="{{isSyncing}}" hint-placeholder-val="{{ false }}">
<section aria-label="Sync progress" style="margin-bottom: 18px; padding: 16px 18px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line)">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px"><h2 class="cond" style="margin: 0; font-size: 22px; font-weight: 700">Syncing Carens</h2><span class="tnum" style="font-size: 13px; color: var(--ink3)">Step 4 of 6 · started 10:23:05</span></div>
<div role="progressbar" aria-valuenow="58" aria-valuemin="0" aria-valuemax="100" aria-label="Sync progress" style="height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-bottom: 14px"><div style="width: 58%; height: 100%; background: var(--brand)"></div></div>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px">
<sc-for list="{{syncSteps}}" as="ss" hint-placeholder-count="6">
<li style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface2); opacity: {{ss.op}}">
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{ss.dotBg}}; color: {{ss.dotFg}}"><svg viewBox="0 0 24 24" width="14" height="14"><path d="{{ss.ic}}" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
<span><span style="display: block; font-weight: 600">{{ss.label}}</span><span class="tnum" style="font-size: 12.5px; color: var(--ink3)">{{ss.sub}}</span></span>
</li>
</sc-for>
</ol>
</section>
</sc-if>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div aria-busy="true" aria-label="Loading your car" style="display: flex; flex-direction: column; gap: 18px">
<div class="skel" style="height: 560px; border-radius: 14px; position: relative"><div style="position: absolute; left: 24px; bottom: 24px; width: 380px; height: 220px; border-radius: 12px; background: var(--surface); opacity: .6"></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px"><div class="skel" style="height: 96px"></div><div class="skel" style="height: 96px"></div><div class="skel" style="height: 96px"></div><div class="skel" style="height: 96px"></div><div class="skel" style="height: 96px"></div><div class="skel" style="height: 96px"></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px"><div class="skel" style="height: 440px"></div><div style="display: flex; flex-direction: column; gap: 10px"><div class="skel" style="height: 22px; width: 40%"></div><div class="skel" style="height: 44px"></div><div class="skel" style="height: 44px"></div><div class="skel" style="height: 44px"></div><div class="skel" style="height: 44px"></div><div class="skel" style="height: 44px"></div><div class="skel" style="height: 44px"></div></div></div>
<p style="margin: 0; color: var(--ink3)">Reading Carens from your data folder…</p>
</div>
</sc-if>

<sc-if value="{{showOverview}}" hint-placeholder-val="{{ true }}">
<div class="panel" style="display: flex; flex-direction: column; gap: 40px">

<section aria-label="Latest drive" class="hero night {{mapClass}}" style="position: relative; height: 620px; border-radius: 14px; overflow: hidden; background: var(--sky); color: var(--hudInk)">
<div id="rb-map-hero" data-keep="1" style="position: absolute; inset: 0"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, var(--sky) 0%, transparent 42%); opacity: .55; pointer-events: none; z-index: 1"></div>

<div style="z-index: 2; position: absolute; left: 22px; top: 20px; right: 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="cond" style="font-size: 15px; font-weight: 600; color: var(--hudInk2)">{{hero.kicker}}</span>
<span class="cond tnum" style="font-size: 26px; font-weight: 700; line-height: 1.1">{{hero.title}}</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div role="group" aria-label="Map style" style="display: flex; padding: 3px; border-radius: 8px; background: var(--hudGlass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--hudLine)">
<sc-for list="{{mapViews}}" as="mv" hint-placeholder-count="3"><button class="btn" aria-pressed="{{mv.pressed}}" onClick="{{mv.pick}}" style="height: 38px; padding: 0 14px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--hudInk); background: {{mv.bg}}">{{mv.label}}</button></sc-for>
</div>
<button class="btn" onClick="{{replayHero}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 8px; background: var(--hudGlass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--hudLine); color: var(--hudInk); font-weight: 600"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 5v14l11-7z" style="fill: currentColor"></path></svg>Replay last drive</button>
</div>
</div>

<div class="cluster" style="z-index: 2; position: absolute; left: 22px; bottom: 22px; width: 560px; padding: 20px 22px 18px; border-radius: 14px; background: var(--hudGlass); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 0 0 1px var(--hudLine), 0 20px 60px rgba(0,0,0,.35); display: flex; gap: 18px; align-items: center; flex-wrap: wrap">
<div style="position: relative; width: 190px; height: 170px; flex: none">
<svg viewBox="0 0 200 180" width="100%" height="100%" role="img" aria-label="{{gauge.aria}}">
<path d="{{gauge.track}}" style="fill: none; stroke: var(--hudLine); stroke-width: 12; stroke-linecap: round"></path>
<path d="{{gauge.fill}}" pathLength="1" class="sweep" style="fill: none; stroke: {{gauge.color}}; stroke-width: 12; stroke-linecap: round"></path>
<path d="{{gauge.ticks}}" style="fill: none; stroke: var(--hudInk2); stroke-width: 1.6; stroke-linecap: round"></path>
<text x="{{gauge.lx}}" y="{{gauge.ly}}" text-anchor="middle" style="font: 600 13px var(--cond); fill: var(--hudInk2)">{{gauge.lo}}</text>
<text x="{{gauge.rx}}" y="{{gauge.ry}}" text-anchor="middle" style="font: 600 13px var(--cond); fill: var(--hudInk2)">{{gauge.hi}}</text>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 10px">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color: var(--hudInk2)"><path d="{{gauge.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span class="num" style="font-size: 40px; line-height: 1">{{gauge.pct}}<span style="font-size: 20px">%</span></span>
<span class="cond" style="font-size: 14px; color: var(--hudInk2); font-weight: 600">{{gauge.label}}</span>
</div>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div>
<span class="cond" style="font-size: 15px; font-weight: 600; color: var(--hudInk2)">Range</span>
<div class="num big" style="font-size: 88px; line-height: .86; letter-spacing: -0.04em">{{car.range}}<span style="font-size: 26px; letter-spacing: 0; margin-left: 6px; color: var(--hudInk2)">{{u.dUnit}}</span></div>
</div>
<div>
<span class="cond" style="font-size: 14px; font-weight: 600; color: var(--hudInk2)">Odometer</span>
<div class="num" aria-label="{{odoAria}}" style="display: flex; align-items: flex-end; gap: 3px; font-size: 30px; line-height: 1">
<sc-for list="{{odo}}" as="d" hint-placeholder-count="6">
<sc-if value="{{d.comma}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: .26em; text-align: center; color: var(--hudInk2)">,</span></sc-if>
<span aria-hidden="true" style="position: relative; display: inline-block; width: .7em; height: 1.2em; overflow: hidden; border-radius: 4px; background: rgba(0,0,0,.28); box-shadow: inset 0 1px 0 var(--hudLine)">
<span class="odo-col" style="position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; transform: translateY({{d.ty}}); transition-delay: {{d.delay}}"><sc-for list="{{digits}}" as="g" hint-placeholder-count="10"><span style="height: 1.2em; line-height: 1.2em">{{g}}</span></sc-for></span>
</span>
</sc-for>
<span style="font-size: 16px; color: var(--hudInk2); margin-left: 6px; padding-bottom: 3px">{{u.dUnit}}</span>
</div>
</div>
</div>
<button class="btn" onClick="{{goCar}}" aria-label="Car photo. Add a photo of your car" style="position: absolute; right: 14px; top: -34px; width: 68px; height: 68px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 3px var(--hudGlass), 0 8px 24px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: var(--ink3)">
<svg viewBox="0 0 32 20" width="44" height="28" aria-hidden="true"><path d="{{car.sil}}" style="fill: currentColor"></path></svg>
<span style="position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--onBrand); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--surface)"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14 M5 12h14" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round"></path></svg></span>
</button>
</div>

<div style="z-index: 2; position: absolute; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--hudGlass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--hudLine); font-size: 13px" class="hide-sm">
<sc-for list="{{legend}}" as="lg" hint-placeholder-count="5"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 18px; height: {{lg.h}}; border-radius: 2px; background: {{lg.c}}; border-top: {{lg.dash}}"></span>{{lg.label}}</span></sc-for>
<span style="font-size: 11.5px; color: var(--hudInk2); margin-top: 2px">{{mapCredit}}</span>
</div>
</section>

<section aria-label="Health" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 176px), 1fr)); gap: 0; border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line)">
<sc-for list="{{health}}" as="hl" hint-placeholder-count="6">
<div style="display: flex; gap: 12px; align-items: center; padding: 18px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: {{hl.bg}}; color: {{hl.fg}}">
<span aria-hidden="true" style="flex: none; width: 46px; height: 46px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{hl.icBg}}; color: {{hl.icFg}}"><svg viewBox="0 0 24 24" width="26" height="26"><path d="{{hl.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
<span style="min-width: 0"><span class="cond" style="display: block; font-size: 23px; font-weight: 700; line-height: 1.05">{{hl.title}}</span><span class="tnum" style="font-size: 13px; color: {{hl.subFg}}">{{hl.sub}}</span></span>
</div>
</sc-for>
</section>

<h2 id="cab-h" class="cond" style="margin: 0 0 14px; font-size: 30px; font-weight: 700">Cabin and climate</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line)">
<sc-for list="{{climate}}" as="cl" hint-placeholder-count="7">
<div style="background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 96px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="color: {{cl.icFg}}"><path d="{{cl.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="font-size: 13.5px; color: var(--ink3)">{{cl.label}}</span>
<span class="cond" style="font-size: 21px; font-weight: 700; line-height: 1; color: {{cl.fg}}">{{cl.state}}</span>
</div>
</sc-for>
</div>
</div>
<div>
<h3 class="cond" style="margin: 0 0 14px; font-size: 22px; font-weight: 700">Seats</h3>
<div style="position: relative; max-width: 380px; padding: 26px 34px; border-radius: 80px 80px 26px 26px; background: var(--surface); box-shadow: 0 0 0 1px var(--line)">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px 34px">
<sc-for list="{{seats}}" as="se" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<span aria-hidden="true" style="width: 62px; height: 70px; border-radius: 16px 16px 10px 10px; display: flex; align-items: center; justify-content: center; background: {{se.bg}}; color: {{se.fg}}; box-shadow: inset 0 0 0 1.5px {{se.ring}}"><svg viewBox="0 0 24 24" width="28" height="28"><path d="{{se.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>
<span style="font-size: 13px; color: var(--ink3)">{{se.label}}</span>
<span class="cond" style="font-size: 17px; font-weight: 700">{{se.state}}</span>
</div>
</sc-for>
</div>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: var(--ink3)">Off, heat (low, medium, high) or cool (low, medium, high), as the car reports each seat.</p>
</div>
</section>

<sc-if value="{{isEV}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="ev-h" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap"><h2 id="ev-h" class="cond" style="margin: 0; font-size: 30px; font-weight: 700">Battery and charging</h2><span class="tnum" style="font-size: 13px; color: var(--ink3)">From status/latest · evStatus</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px">
<div style="padding: 20px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" class="pulse" style="width: 10px; height: 10px; border-radius: 50%; background: var(--charge)"></span><span class="cond" style="font-size: 22px; font-weight: 700">{{ev.state}}</span></div>
<div style="display: flex; align-items: flex-end; gap: 18px"><span class="num" style="font-size: 72px; line-height: .85">{{ev.pct}}<span style="font-size: 28px">%</span></span><span style="padding-bottom: 6px"><span class="num" style="font-size: 28px">{{u.evRange}}</span><span style="color: var(--ink3); margin-left: 4px">EV range</span></span></div>
<div style="position: relative; height: 26px; border-radius: 6px; background: var(--track); overflow: hidden" role="img" aria-label="{{ev.aria}}">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ev.pctW}}; background: var(--charge)"></div>
<div style="position: absolute; left: {{ev.dcL}}; top: 0; bottom: 0; width: 2px; background: var(--ink2)"></div><div style="position: absolute; left: {{ev.acL}}; top: 0; bottom: 0; width: 2px; background: var(--ink)"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink3)" class="tnum"><span>0%</span><span>{{ev.limits}}</span><span>100%</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px">
<div><div style="font-size: 13px; color: var(--ink3)">Time to full (AC)</div><div class="cond tnum" style="font-size: 20px; font-weight: 700">{{ev.ttf}}</div></div>
<div><div style="font-size: 13px; color: var(--ink3)">Plug and port</div><div class="cond" style="font-size: 20px; font-weight: 700">{{ev.plug}}</div></div>
</div>
</div>
<div style="padding: 20px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; align-content: start">
<div><div style="font-size: 13px; color: var(--ink3)">Battery health (SOH)</div><div class="num" style="font-size: 36px">{{ev.soh}}<span style="font-size: 18px">%</span></div></div>
<div><div style="font-size: 13px; color: var(--ink3)">Battery temperature</div><div class="num" style="font-size: 36px">{{u.batTemp}}</div></div>
<div><div style="font-size: 13px; color: var(--ink3)">Energy, last 30 days</div><div class="num" style="font-size: 36px">{{ev.e30}}<span style="font-size: 18px"> kWh</span></div></div>
<div><div style="font-size: 13px; color: var(--ink3)">Regenerated</div><div class="num" style="font-size: 36px">{{ev.regen}}<span style="font-size: 18px"> kWh</span></div></div>
</div>
<div style="padding: 20px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 12px">
<div class="cond" style="font-size: 20px; font-weight: 700">Departure schedules</div>
<sc-for list="{{departures}}" as="dp" hint-placeholder-count="2">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface2); opacity: {{dp.op}}"><span><span class="cond tnum" style="display: block; font-size: 20px; font-weight: 700">{{dp.time}}</span><span style="font-size: 13px; color: var(--ink3)">{{dp.days}}</span></span><span style="text-align: right; font-size: 13px; color: var(--ink2)">{{dp.detail}}</span></div>
</sc-for>
</div>
</div>
</section>
</sc-if>

<section aria-labelledby="nr-h" style="padding: 18px 20px; border-radius: 10px; border: 1.5px dashed var(--line2)">
<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px"><h2 id="nr-h" class="cond" style="margin: 0; font-size: 24px; font-weight: 700; color: var(--ink2)">Not reported by your car</h2><span style="font-size: 13.5px; color: var(--ink3)">{{car.nick}} doesn't send these, so they stay blank. Never estimated.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{notReported}}" as="nr" hint-placeholder-count="4"><span style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 6px; background: var(--surface2); color: var(--ink3); font-weight: 500"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="{{nr.ic}}" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"></path></svg>{{nr.label}}<span class="mono" style="font-size: 11.5px; opacity: .8">—</span></span></sc-for>
</div>
</section>

<section aria-labelledby="mo-h" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px; align-items: end">
<div style="display: flex; flex-direction: column; gap: 16px">
<div><h2 id="mo-h" class="cond" style="margin: 0; font-size: 30px; font-weight: 700">This month</h2><span style="font-size: 13.5px; color: var(--ink3)">{{monthLabel}}</span></div>
<sc-if value="{{hasTrips}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px">
<sc-for list="{{monthStats}}" as="ms" hint-placeholder-count="5">
<div style="border-top: 2px solid var(--ink); padding-top: 6px"><div class="num" style="font-size: 38px; line-height: 1">{{ms.v}}<span style="font-size: 17px; color: var(--ink3); margin-left: 3px">{{ms.u}}</span></div><div style="font-size: 13px; color: var(--ink3)">{{ms.l}}</div></div>
</sc-for>
</div>
</sc-if>
</div>
<div style="grid-column: span 2; min-width: 0">
<sc-if value="{{hasTrips}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: 220px; display: flex; align-items: flex-end; gap: 4px; padding-top: 28px" role="img" aria-label="Distance per day in November, stacked by speed band">
<sc-for list="{{monthBars}}" as="b" hint-placeholder-count="30">
<button class="btn {{b.cls}}" onPointerEnter="{{b.enter}}" onPointerLeave="{{b.leave}}" onFocus="{{b.enter}}" onBlur="{{b.leave}}" aria-label="{{b.aria}}" style="position: relative; flex: 1 1 0; height: 100%; display: flex; flex-direction: column-reverse; justify-content: flex-start; border-radius: 3px; padding: 0; cursor: default">
<sc-for list="{{b.segs}}" as="sg" hint-placeholder-count="3"><span style="display: block; height: {{sg.h}}; background: {{sg.c}}; border-top: 1px solid var(--surface)"></span></sc-for>
<span style="display: block; height: {{b.empty}}; border-radius: 2px; background: {{b.stub}}"></span>
</button>
</sc-for>
<sc-if value="{{dayTip.on}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; top: -6px; left: {{dayTip.x}}; transform: translateX(-50%); padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--ground); font-size: 13px; white-space: nowrap; pointer-events: none; z-index: 2; box-shadow: 0 6px 20px rgba(0,0,0,.2)">
<div class="cond" style="font-size: 17px; font-weight: 700">{{dayTip.title}}</div>
<sc-for list="{{dayTip.rows}}" as="tr" hint-placeholder-count="4"><div class="tnum" style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 2px; background: {{tr.c}}"></span>{{tr.t}}</div></sc-for>
</div>
</sc-if>
</div>
<div class="tnum" style="display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink3); margin-top: 6px"><span>{{axis.a}}</span><span>{{axis.b}}</span><span>{{axis.c}}</span><span>{{axis.d}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink2)">
<sc-for list="{{legend4}}" as="lg" hint-placeholder-count="4"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{lg.c}}"></span>{{lg.label}}</span></sc-for>
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="hatch" style="width: 10px; height: 10px; border-radius: 2px"></span>{{historyStartLabel}}</span>
</div>
</sc-if>
<sc-if value="{{noTrips}}" hint-placeholder-val="{{ false }}">
<div style="height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; border-radius: 10px; border: 1.5px dashed var(--line2); color: var(--ink3); padding: 20px">
<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M8 21l2.2-18 M16 21l-2.2-18 M12 5v2.5 M12 10.5v2.5 M12 16v2.5" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round"></path></svg>
<div class="cond" style="font-size: 22px; font-weight: 700; color: var(--ink)">No trips this month</div>
<div style="max-width: 380px">Drives show up after the next sync. Run <code class="mono">roadbook</code> again after your next drive.</div>
</div>
</sc-if>
</div>
</section>

<sc-if value="{{hasService}}"><section aria-labelledby="svc-h" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap"><h2 id="svc-h" class="cond" style="margin: 0; font-size: 30px; font-weight: 700">Service intervals</h2><span class="tnum" style="font-size: 13.5px; color: var(--ink3)">Odometer {{u.odo}}</span></div>
<p style="margin: 0 0 8px; font-size: 13.5px; color: var(--ink3); max-width: 760px">Assumes every item was serviced on schedule. The car doesn't send your last service date, so month-based due dates can't be worked out.</p>
<sc-for list="{{service}}" as="sv" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) 120px; gap: 6px 20px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line)">
<div><div class="cond" style="font-size: 19px; font-weight: 700">{{sv.name}}</div><div class="tnum" style="font-size: 13px; color: var(--ink3)">Every {{sv.every}}</div></div>
<div role="img" aria-label="{{sv.aria}}" style="position: relative; height: 34px">
<div style="position: absolute; left: 0; right: 0; top: 11px; height: 12px; border-radius: 3px; background: var(--inset)"></div>
<div style="position: absolute; left: 0; width: {{sv.pct}}; top: 11px; height: 12px; border-radius: 3px; background: var(--ink2)"></div>
<div class="rail-dash" style="position: absolute; left: 0; right: 0; top: 16.5px; height: 1.5px; mix-blend-mode: normal"></div>
<sc-for list="{{sv.marks}}" as="mk" hint-placeholder-count="2"><span class="tnum" style="position: absolute; left: {{mk.l}}; top: -2px; transform: translateX(-50%); font-size: 11px; color: var(--ink3)">{{mk.t}}</span><span style="position: absolute; left: {{mk.l}}; top: 8px; width: 1.5px; height: 18px; background: var(--ink3)"></span></sc-for>
<span style="position: absolute; left: {{sv.pct}}; top: 4px; transform: translateX(-50%); width: 14px; height: 26px; border-radius: 3px; background: var(--brand); box-shadow: 0 0 0 2px var(--ground)"></span>
</div>
<div class="tnum" style="text-align: right"><div class="cond" style="font-size: 19px; font-weight: 700">{{sv.left}}</div><div style="font-size: 12.5px; color: var(--ink3)">at {{sv.next}}</div></div>
</div>
</sc-for>
</section></sc-if>

<section aria-labelledby="rt-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><h2 id="rt-h" class="cond" style="margin: 0; font-size: 30px; font-weight: 700">Recent trips</h2><button class="btn" onClick="{{goTimeline}}" style="height: 44px; font-weight: 600; color: var(--brandText)">Open Timeline</button></div>
<sc-if value="{{hasTrips}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px">
<sc-for list="{{recent}}" as="rt" hint-placeholder-count="5">
<button class="btn" onClick="{{rt.open}}" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); min-height: 44px">
<span class="tnum" style="font-size: 13px; color: var(--ink3)">{{rt.when}}</span>
<span class="num" style="font-size: 34px; line-height: 1">{{rt.km}}<span style="font-size: 16px; color: var(--ink3); margin-left: 3px">{{u.dUnit}}</span></span>
<span class="tnum" style="font-size: 13px; color: var(--ink2)">{{rt.sub}}</span>
<span aria-hidden="true" class="{{rt.stripCls}}" style="display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 1px"><sc-for list="{{rt.strip}}" as="sb" hint-placeholder-count="4"><span style="width: {{sb.w}}; background: {{sb.c}}"></span></sc-for></span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noTrips}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: var(--ink3)">No trips yet this month.</p></sc-if>
</section>
</div>
</sc-if>


<!-- ================= TIMELINE ================= -->
<sc-if value="{{showTimeline}}">
<div class="panel {{tl.selClass}}" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section class="tl-list" aria-label="Timeline" style="flex: 1 1 340px; max-width: 400px; max-height: 1400px; overflow-y: auto; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line)">
<div style="position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 12px; border-bottom: 1px solid var(--line)">
<div role="group" aria-label="Filter" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{tl.chips}}" as="c"><button class="btn" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 36px; padding: 0 14px; border-radius: 6px; font-weight: 600; font-size: 14px; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}}">{{c.label}}<span class="tnum" style="margin-left: 6px; opacity: .65">{{c.count}}</span></button></sc-for>
</div>
</div>
<sc-for list="{{tl.days}}" as="day">
<div>
<div class="cond" style="position: sticky; top: 61px; z-index: 1; padding: 12px 16px 6px; font-size: 16px; font-weight: 700; background: var(--surface)">{{day.label}} <span class="tnum" style="font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink3)">· {{day.meta}}</span></div>
<div style="position: relative; padding: 0 10px 10px 34px">
<div aria-hidden="true" style="position: absolute; left: 20px; top: 0; bottom: 14px; width: 3px; border-radius: 2px; background: var(--inset)"></div>
<sc-for list="{{day.items}}" as="it">
<button class="btn" aria-pressed="{{it.pressed}}" onClick="{{it.pick}}" style="position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 10px 12px; margin-bottom: 4px; border-radius: 8px; background: {{it.bg}}; box-shadow: {{it.ring}}">
<span aria-hidden="true" style="position: absolute; left: -20px; top: 14px; width: 13px; height: 13px; border-radius: 50%; background: {{it.dot}}; box-shadow: 0 0 0 3px var(--surface)"></span>
<span style="display: flex; justify-content: space-between; gap: 8px; width: 100%; align-items: baseline"><span class="cond tnum" style="font-size: 18px; font-weight: 700">{{it.title}}</span><span class="cond tnum" style="font-size: 18px; font-weight: 700; white-space: nowrap">{{it.right}}</span></span>
<span class="tnum" style="font-size: 13px; color: var(--ink3)">{{it.sub}}</span>
<sc-if value="{{it.isTrip}}">
<span aria-hidden="true" class="{{it.stripCls}}" style="display: flex; width: 100%; height: 5px; border-radius: 3px; overflow: hidden; gap: 1px"><sc-for list="{{it.strip}}" as="sb"><span style="width: {{sb.w}}; background: {{sb.c}}"></span></sc-for></span>
<sc-if value="{{it.hasBadges}}"><span style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{it.badges}}" as="bd"><span class="tnum" title="{{bd.title}}" style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 12px; font-weight: 600; background: {{bd.bg}}; color: {{bd.fg}}"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="{{bd.ic}}" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>{{bd.n}}</span></sc-for></span></sc-if>
</sc-if>
</button>
</sc-for>
</div>
</div>
</sc-for>
<sc-if value="{{tl.empty}}"><div style="padding: 40px 20px; text-align: center; color: var(--ink3)"><div class="cond" style="font-size: 22px; font-weight: 700; color: var(--ink)">Nothing here</div>No trips match this filter.</div></sc-if>
</section>

<section class="tl-detail" aria-label="Details" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<button class="btn back" onClick="{{tl.back}}" style="display: none; align-items: center; gap: 4px; height: 44px; font-weight: 600; color: var(--brandText); align-self: flex-start"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>Timeline</button>

<sc-if value="{{trip.on}}">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 28px; flex-wrap: wrap">
<div><div class="tnum" style="font-size: 14px; color: var(--ink3)">Trip · {{trip.dayLong}}</div><h1 class="cond tnum h1" style="margin: 0; font-size: 40px; font-weight: 700; line-height: 1.05">{{trip.s}} – {{trip.e}}</h1></div>
<div style="display: flex; gap: 28px; flex-wrap: wrap">
<sc-for list="{{trip.head}}" as="hd"><div><div class="num" style="font-size: 40px; line-height: 1">{{hd.v}}<span style="font-size: 17px; color: var(--ink3); margin-left: 3px">{{hd.u}}</span></div><div style="font-size: 13px; color: var(--ink3)">{{hd.l}}</div></div></sc-for>
</div>
</div>
<sc-if value="{{trip.hasTrail}}">
<div class="night" style="position: relative; height: 460px; border-radius: 12px; overflow: hidden; background: var(--sky)">
<div id="rb-map-trip" data-keep="1" style="position: absolute; inset: 0"></div>
<div style="position: absolute; right: 12px; bottom: 12px; padding: 4px 8px; border-radius: 6px; background: var(--hudGlass); color: var(--hudInk2); font-size: 11.5px">{{mapCredit}}</div>
</div>
<div id="rb-player" data-keep="1" style="border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 16px 18px"></div>
<div style="border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 18px">
<h2 class="cond" style="margin: 0 0 12px; font-size: 24px; font-weight: 700">Time in each speed band</h2>
<div role="img" aria-label="{{trip.bandAria}}" style="display: flex; height: 26px; border-radius: 5px; overflow: hidden; gap: 2px"><sc-for list="{{trip.bands}}" as="bb"><span style="width: {{bb.w}}; background: {{bb.c}}"></span></sc-for></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px">
<sc-for list="{{trip.bands}}" as="bb"><div style="display: flex; gap: 8px; align-items: flex-start"><span style="flex: none; width: 12px; height: 12px; border-radius: 2px; margin-top: 4px; background: {{bb.c}}"></span><div><div style="font-size: 13px; color: var(--ink3)">{{bb.label}}</div><div class="num" style="font-size: 24px">{{bb.t}}</div></div></div></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{trip.noTrail}}">
